<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VTTRPG v0.11.0</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 1rem auto;
      padding: 0 1rem;
      line-height: 1.4;
    }

    h1 {
      font-size: 1.3rem;
    }

    h2 {
      font-size: 1.05rem;
      margin: 1rem 0 .3rem;
    }

    section {
      border: 1px solid #8884;
      border-radius: 6px;
      padding: .7rem .8rem;
      margin: .8rem 0;
    }

    input,
    button {
      font: inherit;
      padding: .35rem .5rem;
      margin: .1rem;
    }

    input[readonly] {
      width: 100%;
      box-sizing: border-box;
    }

    .row {
      display: flex;
      gap: .35rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .chat {
      height: 16rem;
      overflow: auto;
      border: 1px solid #8886;
      padding: .4rem;
      border-radius: 4px;
    }

    .msg {
      margin: .15rem 0;
    }

    .ts {
      opacity: .5;
      font-size: .8em;
    }

    .muted {
      opacity: .65;
      font-size: .9em;
    }

    .log {
      height: 12rem;
      overflow: auto;
      background: #8881;
      padding: .4rem;
      white-space: pre-wrap;
      font: .76rem ui-monospace, monospace;
    }

    .status {
      font-weight: 700;
    }

    #qr {
      margin-top: .6rem;
    }
  </style>
</head>

<body>
  <h1>VTTRPG v0.11.0</h1>

  <div id="app">
    Loading…
  </div>

  <footer id="version" class="muted">
    VTTRPG v0.11.0
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
  <script type="module" src="./app.js?v=0.11.0"></script>
</body>
</html>
