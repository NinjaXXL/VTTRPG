<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VTTRPG Skeleton v0.9.0</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 880px;
      margin: 1rem auto;
      padding: 0 1rem;
      line-height: 1.4;
    }

    h1 { font-size: 1.3rem; }
    h2 { font-size: 1.05rem; margin: 1rem 0 .3rem; }

    section {
      border: 1px solid #8884;
      border-radius: 6px;
      padding: .6rem .8rem;
      margin: .8rem 0;
    }

    input, select, button {
      font: inherit;
      padding: .25rem .5rem;
      margin: .1rem;
    }

    input[readonly] {
      width: 100%;
      box-sizing: border-box;
    }

    .row {
      display: flex;
      gap: .3rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .row input:not([type]) {
      flex: 1;
      min-width: 8rem;
    }

    .chat {
      height: 14rem;
      overflow-y: auto;
      border: 1px solid #8886;
      padding: .3rem;
      border-radius: 4px;
    }

    .msg .ts {
      opacity: .5;
      font-size: .8em;
    }

    .msg.sys {
      opacity: .65;
      font-style: italic;
    }

    .log {
      height: 20rem;
      overflow-y: auto;
      font-size: .78rem;
      background: #8881;
      padding: .3rem;
      margin: 0;
      white-space: pre-wrap;
    }

    .status {
      font-weight: 600;
    }

    .muted {
      opacity: .65;
      font-size: .9em;
    }

    footer {
      margin: 2rem 0 1rem;
      text-align: center;
      border-top: 1px solid #8884;
      padding-top: .5rem;
    }

    .tag {
      font-size: .75em;
      border: 1px solid #8888;
      border-radius: 3px;
      padding: 0 .3em;
      margin-left: .3em;
    }

    #qr {
      margin-top: .6rem;
    }
  </style>
</head>
<body>
  <h1>VTTRPG – Skeleton v0.9.0</h1>

  <div id="app">
    Loading&hellip; (if this stays, check the browser console)
  </div>

  <footer id="version" class="muted">
    VTTRPG skeleton v0.9.0
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
  <script type="module" src="./app.js?v=0.9.0"></script>
</body>
</html>
