<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VTTRPG</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.4;
    }

    section {
      border: 1px solid #aaa;
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem 0;
    }

    button,
    input {
      font: inherit;
      padding: .5rem;
    }

    input {
      box-sizing: border-box;
      width: 100%;
    }

    .row {
      display: flex;
      gap: .5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .row input {
      flex: 1;
      min-width: 0;
    }

    #qr {
      margin-top: 1rem;
    }

    #chat {
      height: 18rem;
      overflow: auto;
      border: 1px solid #ccc;
      padding: .5rem;
      margin-bottom: .5rem;
    }

    .msg {
      margin: .25rem 0;
    }

    .muted {
      opacity: .65;
    }

    .status {
      font-weight: 600;
    }
  </style>
</head>

<body>
  <h1>VTTRPG</h1>

  <div id="app"></div>

  <script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1/build/qrcode.min.js"></script>
  <script src="./app.js?v=1"></script>
</body>
</html>
