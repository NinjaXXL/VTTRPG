name: Release to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_version:
        description: Cache version for this redeploy (for example v1.2.0-rebuild.1)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Verify static site
        run: npm run verify

      - name: Set service-worker cache version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.release_version }}
        run: sed -i "s/__RELEASE_VERSION__/${RELEASE_VERSION}/g" sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
